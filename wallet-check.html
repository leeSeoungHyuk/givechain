<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GiveChain Wallet Check</title>
    <style>
      body { max-width: 720px; margin: 48px auto; padding: 0 20px; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
      button { margin: 0 8px 12px 0; padding: 10px 14px; cursor: pointer; }
      dl { display: grid; grid-template-columns: 130px 1fr; gap: 10px; }
      dt { font-weight: 700; } dd { margin: 0; overflow-wrap: anywhere; }
      #status { color: #3656a8; }
    </style>
  </head>
  <body>
    <h1>GiveChain Wallet Check</h1>
    <p>MetaMask를 연결하고 Hardhat Local 네트워크 상태를 확인합니다.</p>
    <button id="connectBtn">MetaMask 연결</button>
    <button id="switchBtn">GiveChain Local로 전환</button>
    <dl>
      <dt>Account</dt><dd id="account">-</dd>
      <dt>Chain ID</dt><dd id="chainId">-</dd>
      <dt>Network</dt><dd id="network">-</dd>
      <dt>Status</dt><dd id="status">지갑을 연결하세요.</dd>
    </dl>
    <script>
      const GIVECHAIN_CHAIN_ID = "0x7a6a";
      const GIVECHAIN_NETWORK = {
        chainId: GIVECHAIN_CHAIN_ID,
        chainName: "GiveChain Local",
        rpcUrls: ["http://127.0.0.1:8545"],
        nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
      };
      const accountEl = document.getElementById("account");
      const chainIdEl = document.getElementById("chainId");
      const networkEl = document.getElementById("network");
      const statusEl = document.getElementById("status");

      function setStatus(message) { statusEl.textContent = message; }
      function updateNetworkStatus(chainId) {
        chainIdEl.textContent = chainId || "-";
        networkEl.textContent = chainId === GIVECHAIN_CHAIN_ID ? "GiveChain Local 연결됨" : "다른 네트워크";
      }
      async function refreshWalletInfo() {
        if (!window.ethereum) { setStatus("MetaMask를 설치한 브라우저에서 열어주세요."); return; }
        const accounts = await window.ethereum.request({ method: "eth_accounts" });
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        accountEl.textContent = accounts[0] || "연결되지 않음";
        updateNetworkStatus(chainId);
      }
      async function connectWallet() {
        if (!window.ethereum) throw new Error("MetaMask를 찾을 수 없습니다.");
        await window.ethereum.request({ method: "eth_requestAccounts" });
        await refreshWalletInfo();
        setStatus("MetaMask 연결 완료");
      }
      async function switchNetwork() {
        if (!window.ethereum) throw new Error("MetaMask를 찾을 수 없습니다.");
        try {
          await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: GIVECHAIN_CHAIN_ID }] });
        } catch (error) {
          if (error.code !== 4902) throw error;
          await window.ethereum.request({ method: "wallet_addEthereumChain", params: [GIVECHAIN_NETWORK] });
        }
        await refreshWalletInfo();
        setStatus("GiveChain Local 네트워크로 전환했습니다.");
      }
      document.getElementById("connectBtn").addEventListener("click", () => connectWallet().catch((e) => setStatus(e.message)));
      document.getElementById("switchBtn").addEventListener("click", () => switchNetwork().catch((e) => setStatus(e.message)));
      if (window.ethereum) {
        window.ethereum.on("accountsChanged", refreshWalletInfo);
        window.ethereum.on("chainChanged", refreshWalletInfo);
        refreshWalletInfo().catch((e) => setStatus(e.message));
      } else {
        setStatus("MetaMask를 설치한 브라우저에서 열어주세요.");
      }
    </script>
  </body>
</html>
